 .col h2{font-size:12px;margin:0;padding:8px 10px 4px;line-height:1.25}

 .card.fte{border-left-color:#1F4E79} .card.cont{border-left-color:#C65911;background:#FCEFE2}
 .card.fh{border-style:dashed;border-left-style:solid;outline:1px dashed #999;outline-offset:-3px}
 .card .nm{font-weight:700} .card .meta{color:#555;font-size:10px} .card .cap{color:#B26A00;font-weight:700;font-size:10px}

const board = document.getElementById('board');
const colByName = {};
function makeColumn(name, color, extraClass){
  const col = document.createElement('div'); col.className='col'+(extraClass?' '+extraClass:'');
  col.style.borderTopColor=color; col.dataset.squad = name;
  col.innerHTML = `<h2 style="color:${color}">${name}</h2><div class="cnt"></div>`;
  const drop = document.createElement('div'); drop.className='drop'; col.appendChild(drop);
  drop.addEventListener('dragover', e=>{e.preventDefault(); col.classList.add('over');});
  drop.addEventListener('dragleave', ()=>col.classList.remove('over'));
  drop.addEventListener('drop', e=>{e.preventDefault(); col.classList.remove('over');
    const c = document.getElementById(e.dataTransfer.getData('id')); if(c) drop.appendChild(c); refresh();});
  board.appendChild(col); colByName[name]=drop; return drop;
}
DATA.squads.forEach(sq => makeColumn(sq.name, sq.color));
// staging column for people without a home
makeColumn('🅿 Park / no squad', '#888', 'park');
let newSqCount = 0;
function addSquad(){
  const n = prompt('Name the new squad:', 'New squad '+(++newSqCount));
  if(!n) { newSqCount--; return; }
  if(colByName[n]){ alert('A column named "'+n+'" already exists.'); return; }
  makeColumn(n, '#2E8B57', 'newsq'); refresh();
  board.scrollLeft = board.scrollWidth;
}
DATA.cards.forEach((p,i)=>{
  const id='c'+i; const card=document.createElement('div');
  const cont = p.wt==='Contingent'; card.className='card '+(cont?'cont':'fte')+(p.status==='Future Hire'?' fh':'');
  card.id=id; card.draggable=true; card.dataset.orig=p.squad; card.dataset.name=p.name; card.dataset.eeid=p.eeid; card.dataset.wt=p.wt;
  let badges = cont?'<span class="badge b-cont">C</span>':'';
  if(p.status==='Future Hire') badges+='<span class="badge b-fh">FH</span>';
  if(p.status==='On Leave') badges+='<span class="badge b-leave">leave</span>';
  let cap='';
  if(p.sq2 && p.sq2pct) cap = `⚡ split: ${p.sq1||'?'} here + ${p.sq2pct} ${p.sq2}`;
  else if(p.sq1 && p.sq1!=='100%') cap = `⚡ ${p.sq1} allocation`;
  card.innerHTML = `<div class="nm">${p.name}${badges}</div>`+
    `<div class="meta">${p.role||''}${p.loc?' · '+p.loc:''}${cont&&p.end?' · ends '+p.end:''}</div>`+
    (cap?`<div class="cap">${cap}</div>`:'')+
    `<div class="meta moved hidden"></div>`;
  card.addEventListener('dragstart', e=>{e.dataTransfer.setData('id',id); card.classList.add('drag');});
  card.addEventListener('dragend', ()=>card.classList.remove('drag'));
  (colByName[p.squad]||colByName[DATA.squads[0].name]).appendChild(card);
});
function refresh(){
  let fte=0,cont=0,moved=0;
  document.querySelectorAll('.col').forEach(col=>{
    const drop=col.querySelector('.drop');
    let f=0,c=0; drop.querySelectorAll('.card').forEach(cd=>{cd.dataset.wt==='Contingent'?c++:f++;});
    fte+=f; cont+=c;
    const tot=f+c; const pct=tot?Math.round(c/tot*100):0;
    col.querySelector('.cnt').textContent = `${tot} ppl · ${f} FTE / ${c} cons${tot?` · ${pct}% cons`:''}`;
  });
  document.querySelectorAll('.card').forEach(cd=>{
    const now=cd.closest('.col').dataset.squad; const mv=cd.querySelector('.moved');
    if(now!==cd.dataset.orig){moved++; cd.classList.add('ismoved'); mv.classList.remove('hidden'); mv.textContent=`→ moved from ${cd.dataset.orig}`;}
    else {cd.classList.remove('ismoved'); mv.classList.add('hidden');}
  });
  document.getElementById('tally').innerHTML=`<b>${fte+cont}</b> people · <b>${fte}</b> FTE / <b>${cont}</b> consultants · <b style="color:#7CFC9E">${moved}</b> moved`;
}
function exportMoves(){
  const rows=[['EEID','Display Name','Worker Type','From Squad','To Squad']];
  document.querySelectorAll('.card').forEach(cd=>{
    const now=cd.closest('.col').dataset.squad;
    if(now!==cd.dataset.orig) rows.push([cd.dataset.eeid,cd.dataset.name,cd.dataset.wt,cd.dataset.orig,now]);
  });
  if(rows.length===1){alert('No moves to export yet — drag some cards first.');return;}
  const csv=rows.map(r=>r.map(x=>`"${(x||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,16).replace(/[:T]/g,'').replace(/-/g,'');
  a.href=URL.createObjectURL(blob); a.download=`People_Allocation_Moves_${d}.csv`; a.click();
}
function resetAll(){DATA.cards.forEach((p,i)=>{const c=document.getElementById('c'+i); (colByName[p.squad]).appendChild(c);}); refresh();}
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(cd=>{
    const hit=!q || cd.textContent.toLowerCase().includes(q); cd.classList.toggle('hidden',!hit);
  });
});
document.getElementById('stamp').textContent='Generated 2026-06-03 · '+DATA.cards.length+' people';
refresh();
